<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Result Management</h1>

    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter student name">

    <label>Roll Number</label>
    <input type="text" id="rollNumber" placeholder="Enter roll number">

    <label>Mathematics</label>
    <input type="number" id="maths" min="0" max="100">

    <label>Computer Science</label>
    <input type="number" id="computer" min="0" max="100">

    <label>English</label>
    <input type="number" id="english" min="0" max="100">

    <label>Physics</label>
    <input type="number" id="physics" min="0" max="100">

    <label>C Programming</label>
    <input type="number" id="cprogramming" min="0" max="100">

    <button id="calculateBtn" onclick="calculateResult()">
        Calculate Result
    </button>

    <button id="resetBtn" onclick="resetForm()">
        Reset
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>

</html>
